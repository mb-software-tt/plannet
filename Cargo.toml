[package]
name = "plannet"
version = "0.2.0"
description = "TUI app for tracking tasks"
authors = ["Marc Bhopalsingh Software <marcbhopalsingh.software@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.3"
crossterm = "0.29.0"
ratatui = "0.30.0"
ratatui-textarea = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
